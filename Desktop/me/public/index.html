<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>SafeReport UG</title>
<link rel="icon" href="/logo.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f3a93'/%3E%3Cpath d='M16 6l8 3v6c0 5-3.5 8.5-8 11-4.5-2.500-8-6-8-11V9z' fill='%23ffffff'/%3E%3C/svg%3E">
<style>
:root{--bg:#f2f5fb;--panel:#ffffff;--panel2:#e9eff9;--line:#c9d5ea;--text:#0e1a3f;--mute:#4f5f88;--accent:#1f3a93;--accent-ink:#ffffff;--red:#c62828;--amber:#9a5b00;--blue:#1a56d6;--radius:14px}
*{box-sizing:border-box;margin:0}
html{color-scheme:light}
body{background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;padding-bottom:80px}
.wrap{max-width:560px;margin:0 auto;padding:16px}
.wrap.wide{max-width:1100px}
header.top{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;max-width:1100px;margin:0 auto;background:linear-gradient(118deg,#102a68 0%,#1f469f 58%,#2a73ce 100%);color:#fff;border-bottom:4px solid #f2c200;box-shadow:0 8px 22px #0f2c6838;min-height:76px}
.brand{font-weight:800;font-size:19px;letter-spacing:.02em;display:flex;align-items:center;text-shadow:0 1px 2px #081a4050}.brand b{color:#ffd84a}
.tag{font-size:12px;color:var(--mute);border:1px solid var(--line);padding:5px 11px;border-radius:99px}
h1{font-size:30px;line-height:1.15;margin:18px 0 10px}h2{font-size:22px;margin:6px 0 12px}h3{font-size:15px;color:var(--mute);font-weight:600;margin:16px 0 8px;text-transform:uppercase;letter-spacing:.04em}
p.lead{color:var(--mute);margin-bottom:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.btn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:14px 16px;border-radius:var(--radius);border:1px solid var(--line);background:var(--panel2);color:var(--text);font:inherit;cursor:pointer;text-align:left;text-decoration:none}
.btn small{display:block;color:var(--mute);font-size:13px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}.btn.primary small{color:#0a4a37}
.btn.sm{width:auto;display:inline-flex;padding:8px 12px;font-size:14px;white-space:nowrap}
.btn.danger{border-color:#5a2a2a;color:var(--red)}
.btn:disabled{opacity:.5;cursor:wait}
.sos{border:1px solid #6b2b2b;background:#2a1517;color:#ffb3b3;border-radius:var(--radius);padding:14px;font-size:14px;margin-top:16px}.sos b{color:#ff8a8a;font-size:16px}
label{display:block;font-size:14px;margin:14px 0 6px;font-weight:600}
input,select,textarea{width:100%;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0}
textarea{min-height:110px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.hint{font-size:13px;color:var(--mute);margin-top:6px}
.err{background:#2a1517;border:1px solid #6b2b2b;color:#ffb3b3;border-radius:12px;padding:10px 12px;margin:12px 0;font-size:14px}
.ok{background:#102a22;border:1px solid #1f5a44;color:#9ff0cf;border-radius:12px;padding:10px 12px;margin:12px 0;font-size:14px}
.check{display:flex;gap:10px;align-items:flex-start;margin:16px 0;font-weight:400}.check input{width:auto;margin-top:4px}
.refbox{text-align:center;font-size:36px;font-weight:800;letter-spacing:.06em;padding:18px;margin:12px 0}
.pinbox{text-align:center;font-size:26px;letter-spacing:.25em;color:var(--amber);padding:10px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:#f8faff;border-top:1px solid #c8d6ee;box-shadow:0 -8px 24px #132e6818;display:flex;justify-content:center;align-items:center;gap:8px;padding:9px 12px calc(9px + env(safe-area-inset-bottom));z-index:10;perspective:800px}
nav.tabs a{flex:1;max-width:140px;text-align:center;color:var(--mute);text-decoration:none;font-size:12px;padding:8px 5px;border-radius:13px;border:1px solid transparent;transition:transform .2s ease,box-shadow .2s ease,background .2s ease,color .2s ease,border-color .2s ease;transform:translateY(0);transform-style:preserve-3d}
nav.tabs a .i{display:block;font-size:21px;line-height:1.2;transition:transform .2s ease}
nav.tabs a:hover,nav.tabs a:focus-visible{color:#fff;background:linear-gradient(145deg,#2864c5,#17377f);border-color:#85a8e7;box-shadow:0 9px 18px #17377f42;transform:translateY(-5px) rotateX(3deg);outline:none}
nav.tabs a:hover .i,nav.tabs a:focus-visible .i{transform:translateY(-2px) scale(1.08)}
nav.tabs a.on{background:#e7efff;border-color:#c2d3f2}
@media(hover:none){nav.tabs a:active{transform:translateY(-3px);box-shadow:0 6px 12px #17377f30}}
@media(prefers-reduced-motion:reduce){nav.tabs a,nav.tabs a .i{transition:none!important;transform:none!important}}
nav.tabs a.on{color:var(--accent)}
.news-strip{background:linear-gradient(135deg,#102a64,#1f3a93);color:#fff;padding:14px max(16px,calc((100% - 680px)/2));box-shadow:0 4px 14px #14295824}
.news-strip h2{font-size:18px;margin:0 0 8px}.news-carousel{overflow:hidden;border:1px solid #ffffff40;border-radius:14px;background:#132f70}.news-track{display:flex;transition:transform .5s ease}.news-slide{flex:0 0 100%;min-height:250px;display:flex;align-items:stretch;color:#fff;background:linear-gradient(120deg,#17377f,#2864c5)}.news-slide img{display:block;width:48%;min-height:250px;object-fit:cover;background:#dce8fc}.news-copy{width:52%;padding:18px;display:flex;flex-direction:column;justify-content:center;gap:8px}.news-copy small{color:#d8e5ff}.news-copy b{font-size:19px;line-height:1.28}.news-copy span{font-size:14px;line-height:1.45;color:#edf3ff;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}.news-copy a{color:#fff;font-weight:700;text-decoration:underline}.news-slide.no-photo .news-copy{width:100%}.news-carousel-controls{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 2px}.news-carousel-controls button{border:1px solid #ffffff80;background:#ffffff12;color:#fff;border-radius:9px;padding:6px 12px;font:inherit;cursor:pointer}.news-dots{display:flex;gap:6px}.news-dots button{width:10px;height:10px;padding:0;border-radius:50%;background:#ffffff70}.news-dots button.active{background:#fff;transform:scale(1.25)}.news-control{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:9px;font-size:12px;color:#d8e5ff}.news-control button{border:1px solid #ffffff80;background:transparent;color:#fff;border-radius:9px;padding:7px 10px;font:inherit;cursor:pointer}
.home-wallpaper{position:fixed;z-index:0;inset:0;pointer-events:none;background-position:center;background-size:cover;background-repeat:no-repeat;opacity:0;transition:opacity .45s ease}.home-wallpaper.visible{opacity:.34}#app>.home-wallpaper~*{position:relative;z-index:1}header.top{position:relative;z-index:2}
@media(max-width:520px){.news-slide{min-height:225px}.news-slide img{width:42%;min-height:225px}.news-copy{width:58%;padding:12px;gap:6px}.news-copy b{font-size:16px}.news-copy span{-webkit-line-clamp:3;font-size:12px}}
@media(prefers-reduced-motion:reduce){.news-track,.home-wallpaper{transition:none!important}}
.notice-pop{position:fixed;z-index:30;top:16px;left:50%;transform:translateX(-50%);width:min(92vw,480px);background:#fff;border-left:5px solid #168653;border-radius:12px;box-shadow:0 10px 36px #10244c44;padding:14px 44px 14px 16px;color:#132442}.notice-pop b{display:block}.notice-pop button{position:absolute;right:8px;top:8px;border:0;background:transparent;color:#40516d;font-size:20px;cursor:pointer}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.b-urgent{background:#3a1519;color:#ff8f8f;border-color:#6b2b2b}.b-high{background:#33260f;color:var(--amber);border-color:#6b4f1b}.b-normal{}
.s-Received{color:var(--blue)}.s-Resolved{color:var(--accent)}.s-Rejected{color:var(--red)}
.timeline{margin:10px 0 4px}.step{display:flex;gap:12px;padding:8px 0;position:relative;color:var(--mute)}
.step .dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);margin-top:4px;flex:none;background:var(--bg)}
.step.done{color:var(--text)}.step.done .dot{background:var(--accent);border-color:var(--accent)}
.step small{display:block;color:var(--mute);font-size:12px}
.step:not(:last-child):before{content:"";position:absolute;left:6px;top:24px;bottom:-8px;width:2px;background:var(--line)}
.msgs{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.msg{max-width:85%;padding:9px 12px;border-radius:14px;font-size:14px;background:var(--panel2);align-self:flex-start}
.msg.me{background:#14463a;align-self:flex-end}.msg small{display:block;color:var(--mute);font-size:11px;margin-top:3px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px}.tile b{font-size:26px;display:block}.tile span{font-size:12px;color:var(--mute)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bar{display:flex;align-items:center;gap:8px;font-size:13px;margin:5px 0}.bar span.k{width:120px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar i{display:block;height:10px;background:var(--accent);border-radius:5px;min-width:3px}.bar em{font-style:normal;color:var(--mute)}
.case{cursor:pointer}.case:hover{border-color:var(--accent)}
.case .meta{font-size:13px;color:var(--mute);margin:4px 0}
.case-head{display:flex;justify-content:space-between;gap:8px;align-items:center}
.sub{display:flex;gap:8px;margin:8px 0 14px;overflow:auto}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px}
.modal{position:fixed;inset:0;background:#000a;z-index:20;display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:16px}
.modal>.sheet{background:var(--bg);border:1px solid var(--line);border-radius:18px;width:100%;max-width:720px;padding:16px;margin:auto 0}
.evi{display:flex;gap:8px;flex-wrap:wrap}.evi img,.evi video{width:120px;height:120px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}th{color:var(--mute);font-weight:600}
.warn{background:#33260f;border:1px solid #6b4f1b;color:var(--amber);border-radius:12px;padding:8px 12px;font-size:13px;margin:8px 0}
footer.note{text-align:center;color:var(--mute);font-size:12px;margin:24px 0}
@media(max-width:700px){.tiles{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}

.cambox{position:relative;background:#000;border-radius:var(--radius);overflow:hidden;aspect-ratio:4/3;margin:8px 0 12px;border:1px solid var(--line)}
.cambox video{width:100%;height:100%;object-fit:cover;display:block}.cambox video.mirror{transform:scaleX(-1)}
.camshade{position:absolute;left:0;right:0;bottom:0;padding:10px 12px;background:linear-gradient(transparent,#000c);font-size:14px;text-align:center}
.pill{display:inline-block;background:#33385a;border:1px solid #5a5f8a;color:#e6e8ff;padding:6px 14px;border-radius:99px;font-weight:600;font-size:14px;margin:4px 0}
.info{background:#12303f;border:1px solid #1f5a74;color:#9fdcf5;border-radius:12px;padding:10px 12px;margin:12px 0;font-size:14px}
.stp{padding:4px 0;color:var(--mute)}.stp.done{color:var(--accent)}.stp.done:after{content:" ✓"}
td .th{width:44px;height:44px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.ok-t{color:var(--accent)}.bad-t{color:var(--red)}

.gov{background:#0a0f0e;border-bottom:1px solid var(--line);color:var(--mute);font-size:12px;padding:6px 14px;text-align:center}
.svc{display:block;text-decoration:none;color:var(--text);margin:0}.svc b{display:block;margin-bottom:4px}.svc small{color:var(--mute)}
.svcs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wlist a{display:block;padding:10px 0;border-bottom:1px solid var(--line);color:var(--blue);text-decoration:none}
.hbar{height:10px;border-radius:6px;background:var(--accent);margin:4px 0 10px}
.catcard{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:14px;margin-bottom:10px;color:var(--text);font:inherit;cursor:pointer}.catcard b{display:block;margin-bottom:4px}.catcard small{color:var(--mute)}
.caution{background:#33260f;border:1px solid #6b4f1b;color:var(--amber);border-radius:12px;padding:14px;font-size:14px;margin:12px 0}

.adv h3{margin:0 0 6px;font-size:16px;text-transform:none;letter-spacing:0;color:var(--text)}.adv ul,.adv ol{padding-left:20px;margin:6px 0;line-height:1.6}
.offbar{display:flex;gap:12px;align-items:center;background:linear-gradient(90deg,#0a2a22,#14463c);padding:14px 16px;border-bottom:2px solid var(--accent)}.offbar b{display:block;font-size:17px;letter-spacing:.5px}.offbar small{color:#b9d6cd}
.stmt{font-size:16px;line-height:1.65;color:var(--text)}.bigwarn{text-align:center;font-size:30px;font-weight:700;margin:14px 0}
.grp{margin:22px 0 8px;font-size:15px;letter-spacing:.8px;text-transform:uppercase;color:var(--accent)}
.catcard{padding:18px!important}.catcard b{font-size:18px!important}.catcard small{font-size:15px;line-height:1.45}

.logo{height:36px;width:36px;background:#fff;border-radius:50%;padding:2px;vertical-align:middle;margin-right:8px}.biglogo{display:block;margin:6px auto 4px;height:104px;width:104px;background:#fff;border-radius:50%;padding:5px}
.slip{background:#fff;color:#111;border-radius:12px;padding:18px;max-width:520px;margin:0 auto 14px}.slip-h{display:flex;gap:12px;align-items:center;border-bottom:2px solid #1f2a8a;padding-bottom:10px;margin-bottom:8px;color:#1f2a8a}
.slip table{width:100%;border-collapse:collapse}.slip td{padding:5px 0;border-bottom:1px solid #ddd;font-size:14px;vertical-align:top}.slip td:first-child{color:#555;width:36%}
.slip .sigimg{max-width:240px;border:1px solid #ccc;border-radius:6px}.slip .qr{text-align:center;margin:10px 0}.slip .qr svg{width:150px;height:150px}.slip small{display:block;color:#555;word-break:break-all}.slip ul{margin:4px 0;padding-left:18px;font-size:13px}.slip-note{font-size:12px;color:#444}
@media print{body{background:#fff!important}body *{visibility:hidden}#slip,#slip *{visibility:visible}#slip{position:absolute;left:0;top:0;width:100%;max-width:none}}

.bars-wrap .bar span.k{width:150px}

<body class="app-theme">
<header class="top"><div class="brand"><img class="logo" src="/logo.png" alt="Uganda Police crest">SafeReport <b>UG</b></div><span class="tag">Official Reporting Portal</span></header>

<script>
if (!/^https?:$/.test(location.protocol)) { document.body.innerHTML = '<div style="font:16px system-ui;padding:24px;max-width:480px;margin:auto;color:#132447;background:#f4f7ff;min-height:100vh"><h2>Server not running</h2><p>This page was opened as a file, so it cannot reach the database. Start the server first, then open <b>http://localhost:3000</b> in the browser.</p><p style="color:#536687">Steps: <code>npm install</code>, then <code>node server.js</code>. See README.</p></div>'; throw new Error('Open through the server (http://localhost:3000), not as a file.'); }

'use strict';
const $app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let META = { districts: [], categories: [], statuses: [] };
let ME = null;                 // logged-in police user
let draftFiles = [];           // evidence files for the report form
let policeTab = 'dashboard';
let modalRef = null;
let newsPoller = null;
let newsCarouselTimer = null, newsIndex = 0, newsItems = [];
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };

async function api(path, method = 'GET', body) {
  const r = await fetch(path, { method, headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
  const ct = r.headers.get('content-type') || '';
  const data = ct.includes('json') ? await r.json() : await r.text();
  if (!r.ok) throw new Error((data && data.error) || 'Request failed');
  return data;
}
// server timestamps (with seconds) are UTC -> show in the viewer's local time; occurred_at (16 chars) is already local
const fmt = d => { if (!d) return ''; d = String(d).replace('T', ' ');
  if (d.length > 16) { const t = new Date(d.slice(0, 19).replace(' ', 'T') + 'Z'); if (!isNaN(t)) { const p = n => String(n).padStart(2, '0'); return `${t.getFullYear()}-${p(t.getMonth() + 1)}-${p(t.getDate())} ${p(t.getHours())}:${p(t.getMinutes())}`; } }
  return esc(d.slice(0, 16)); };
const badge = p => `<span class="badge b-${esc(p)}">${esc(p)}</span>`;
const err = m => `<div class="err" role="alert">${esc(m)}</div>`;

/* ---------------- router ---------------- */
async function route() {
  let h = (location.hash || '#home').slice(1).split('?')[0];
  if (h.startsWith('track/')) { sessionStorage.setItem('fillref', decodeURIComponent(h.slice(6))); h = 'track'; }
  document.querySelectorAll('#tabs a').forEach(a => a.classList.toggle('on', a.dataset.t === h));
  document.body.classList.toggle('pol', h === 'police');
  const tc = document.querySelector('meta[name=theme-color]'); if (tc) tc.content = '#1f3a93';
  window.scrollTo(0, 0);
  ({ home: vHome, report: vReport, track: vTrack, police: vPolice, kiosk: vKiosk, stats: vStats, safety: vSafety, victims: vVictims }[h] || vHome)();
}
window.addEventListener('hashchange', route);

/* ---------------- HOME ---------------- */
function vHome() {
  const mine = (lsGet('myrefs') || '').split(',').filter(Boolean);
  $app.innerHTML = `<div class="home-wallpaper" id="homewall" aria-hidden="true"></div><div class="gov">🇺🇬 UGANDA POLICE E-CRIME REPORTING PORTAL</div>
    <section class="news-strip" aria-labelledby="news-heading"><h2 id="news-heading">Latest news &amp; updates</h2><div id="newsfeed" class="news-carousel"><div class="news-slide no-photo"><div class="news-copy"><b>Loading the latest public updates…</b></div></div></div><div id="news-source" class="hint" style="color:#d8e5ff;margin-top:8px">Checking the official UPF news feed when available.</div><div class="news-control"><a style="color:#fff" target="_blank" rel="noopener noreferrer" href="https://upf.go.ug/">Visit Uganda Police Force news ↗</a><button type="button" id="news-opt">Enable alerts</button></div><div id="news-opt-state" class="hint" style="color:#d8e5ff;margin-top:6px">Choose whether to get update alerts on this device.</div></section><div class="wrap">
    <img class="biglogo" src="/logo.png" alt="Uganda Police crest">
    <div class="sos" style="margin-top:0"><b>If this is an emergency, call 999 or 112.</b> Do not submit a tip for danger happening right now.</div>
    <h1>Submit a tip.<br>Protect your community.</h1>
    <p class="lead">Report a crime to Uganda Police, anonymously if you wish. Add a voice message or your live location, and follow your case with a reference number.</p>
    <a class="btn primary" href="#report" data-precat=""><span>Submit a Tip<small>Anonymous option · voice and location supported</small></span><span>→</span></a>
    <div style="height:10px"></div>
    <a class="btn" href="#track"><span>Track a report<small>Use your reference number and PIN</small></span><span>→</span></a>
    <div class="card" style="margin-top:12px"><b>Find a nearby police station</b><div class="hint">Use your current location to find registered stations and open directions in Google Maps.</div><button type="button" class="btn sm" id="findstations" style="margin-top:8px">📍 Search nearby stations</button><div id="nearbyhome"></div></div>
    ${mine.length ? `<h3>Reports on this device</h3>${mine.slice(-3).reverse().map(r => `<a class="btn" style="margin-bottom:8px" href="#track" data-fill="${esc(r)}"><span>${esc(r)}<small>Tap to track (you will need your PIN)</small></span><span>→</span></a>`).join('')}` : ''}
    <h3>Report crime and fraud</h3>
    <div class="card wlist" style="padding:4px 14px">
      <a href="#report" data-precat="">Submit an anonymous tip online</a>
      <a href="#report" data-precat="Mobile money fraud">Report mobile money fraud</a>
      <a href="#report" data-precat="Cybercrime">Report cyber scams and incidents</a>
      <a href="#report" data-precat="Corruption">Report corruption, including by an officer</a>
      <a href="#report" data-precat="Defilement or child abuse">Report a crime against a child</a>
    </div>
    <h3>Services</h3>
    <div class="svcs">
      <a class="card svc" href="#stats"><b>📊 Crime statistics</b><small>What is being reported</small></a>
      <a class="card svc" href="#safety"><b>🛡 Scams & safety</b><small>Stay safe, spot fraud</small></a>
      <a class="card svc" href="#victims"><b>🤝 Victim support</b><small>What to do after a crime</small></a>
      <a class="card svc" href="#track"><b>🔎 Case status</b><small>Check progress, reply to police</small></a>
    </div>
    <h3>Police sign-in</h3>
    <a class="btn" href="#police"><span>Officers<small>National ID number and password</small></span><span>→</span></a>
    <footer class="note">Reports are reviewed by Uganda Police officers. Knowingly giving false information to the police is an offence.</footer>
  </div>`;
  document.getElementById('findstations').onclick=()=>findNearbyStations('nearbyhome');
  if(newsCarouselTimer)clearInterval(newsCarouselTimer);
  loadNewsFeed();
  const opt = document.getElementById('news-opt'), opted = lsGet('newsOptIn') === '1';
  opt.textContent = opted ? 'Turn alerts off' : 'Enable alerts';
  document.getElementById('news-opt-state').textContent = opted ? 'Update alerts are enabled on this device while the app is open.' : 'Choose whether to get update alerts on this device.';
  opt.onclick = async () => {
    if (lsGet('newsOptIn') === '1') { lsSet('newsOptIn','0'); opt.textContent='Enable alerts'; document.getElementById('news-opt-state').textContent='Update alerts are off.'; return; }
    if (!('Notification' in window)) { document.getElementById('news-opt-state').textContent='This browser does not support notifications. New updates will still appear here.'; return; }
    const permission = Notification.permission === 'granted' ? 'granted' : await Notification.requestPermission();
    if (permission !== 'granted') { document.getElementById('news-opt-state').textContent='Notifications were not allowed. Updates remain available here.'; return; }
    lsSet('newsOptIn','1'); opt.textContent='Turn alerts off'; document.getElementById('news-opt-state').textContent='Update alerts are enabled on this device while the app is open.';
    const latest = await api('/api/public/news'); const newest = Math.max(0,...latest.news.map(n=>+n.id)); lsSet('newsLastId',String(Math.max(+(lsGet('newsLastId')||0),newest)));
  };
}
function safeUpfImage(value){try{const u=new URL(value);return u.protocol==='https:'&&['upf.go.ug','www.upf.go.ug'].includes(u.hostname)?u.href:'';}catch{return '';}}
function newsCard(n){const photo=safeUpfImage(n.image_url),media=photo?`<img src="${esc(photo)}" alt="" loading="lazy">`:'';return `<article class="news-slide ${photo?'':'no-photo'}">${media}<div class="news-copy"><small>${esc(n.category)} · ${esc(fmt(n.created_at))}</small><b>${esc(n.title)}</b><span>${esc(n.summary)}</span>${n.url?`<a target="_blank" rel="noopener noreferrer" href="${esc(n.url)}">Read official update ↗</a>`:''}</div></article>`;}
function selectNewsSlide(index){const track=document.getElementById('news-track'),wall=document.getElementById('homewall');if(!track||!newsItems.length)return;newsIndex=(index+newsItems.length)%newsItems.length;track.style.transform=`translateX(-${newsIndex*100}%)`;document.querySelectorAll('.news-dots button').forEach((b,i)=>b.classList.toggle('active',i===newsIndex));const image=safeUpfImage(newsItems[newsIndex]?.image_url);if(wall&&image){wall.classList.remove('visible');setTimeout(()=>{if(!document.getElementById('homewall'))return;wall.style.backgroundImage=`url("${image}")`;wall.classList.add('visible');},40);}}
function renderNewsCarousel(items){const box=document.getElementById('newsfeed');if(!box)return;newsItems=items.slice(0,8);newsIndex=0;if(!newsItems.length){box.innerHTML='<div class="news-slide no-photo"><div class="news-copy"><small>Community information</small><b>No updates have been published yet.</b><span>Public news and safety notices will appear here.</span></div></div>';return;}box.innerHTML=`<div class="news-track" id="news-track">${newsItems.map(newsCard).join('')}</div><div class="news-carousel-controls"><button type="button" id="news-prev" aria-label="Previous update">‹ Previous</button><div class="news-dots">${newsItems.map((_,i)=>`<button type="button" data-news-index="${i}" aria-label="Show update ${i+1}" class="${i?'':'active'}"></button>`).join('')}</div><button type="button" id="news-next" aria-label="Next update">Next ›</button></div>`;box.querySelectorAll('img').forEach(img=>img.onerror=()=>{img.remove();img.closest('.news-slide')?.classList.add('no-photo');});box.onclick=e=>{const dot=e.target.closest('[data-news-index]');if(dot)selectNewsSlide(+dot.dataset.newsIndex);else if(e.target.closest('#news-prev'))selectNewsSlide(newsIndex-1);else if(e.target.closest('#news-next'))selectNewsSlide(newsIndex+1);};selectNewsSlide(0);if(newsItems.length>1)newsCarouselTimer=setInterval(()=>{if(document.getElementById('newsfeed'))selectNewsSlide(newsIndex+1);else clearInterval(newsCarouselTimer);},5000);}
async function loadNewsFeed(){const box=document.getElementById('newsfeed');if(!box)return;try{const r=await api('/api/public/news');renderNewsCarousel(r.news);const src=document.getElementById('news-source');if(src)src.textContent=r.source?.error?`UPF news could not be refreshed right now. ${r.news.length?'Showing saved updates.':'Please try again later or check the official UPF site.'}`:r.source?.last_checked?`Official UPF feed checked ${fmt(r.source.last_checked)}.`:'Official UPF stories are imported automatically when their public feed is available.';if(lsGet('newsLastId')===null)lsSet('newsLastId',String(Math.max(0,...r.news.map(n=>+n.id))));}catch{box.innerHTML='<div class="news-slide no-photo"><div class="news-copy"><b>Latest updates are temporarily unavailable.</b></div></div>';}}
async function pollNews(){if(lsGet('newsOptIn')!=='1')return;try{const after=+(lsGet('newsLastId')||0),r=await api(`/api/public/news?after=${after}`);if(!r.news.length)return;const items=r.news.sort((a,b)=>a.id-b.id);for(const n of items){showNotice('New police update',n.title);if('Notification'in window&&Notification.permission==='granted')new Notification('Uganda Police update',{body:n.title,tag:'safereport-news-'+n.id});}lsSet('newsLastId',String(Math.max(after,...items.map(n=>+n.id))));loadNewsFeed();}catch{}}
function showNotice(title,message){const old=document.getElementById('appnotice');if(old)old.remove();const d=document.createElement('div');d.className='notice-pop';d.id='appnotice';d.setAttribute('role','status');d.setAttribute('aria-live','polite');d.innerHTML=`<b>${esc(title)}</b>${esc(message)}<button type="button" aria-label="Dismiss notification">×</button>`;d.querySelector('button').onclick=()=>d.remove();document.body.appendChild(d);setTimeout(()=>d.remove(),9000);}
function browserPosition(){return new Promise((resolve,reject)=>{if(!navigator.geolocation)return reject(new Error('Location is not available in this browser.'));navigator.geolocation.getCurrentPosition(p=>resolve({lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6)}),()=>reject(new Error('Allow location access or open this site over HTTPS.')),{enableHighAccuracy:true,timeout:12000,maximumAge:30000});});}
const kmBetween=(a,b,c,d)=>{const rad=x=>x*Math.PI/180,h=Math.sin(rad(c-a)/2)**2+Math.cos(rad(a))*Math.cos(rad(c))*Math.sin(rad(d-b)/2)**2;return 12742*Math.asin(Math.sqrt(h));};
async function findNearbyStations(outputId,position=null){const out=document.getElementById(outputId);if(!out)return;out.innerHTML='<div class="hint">Finding your location and nearby stations…</div>';try{const pos=position||await browserPosition(),lookup=await api(`/api/location/reverse?lat=${pos.lat}&lng=${pos.lng}`),{stations}=await api('/api/public/stations');const key=s=>String(s||'').toLowerCase().replace(/\b(district|division|municipality|county|subcounty)\b/g,'').replace(/[^a-z0-9]/g,'');const list=stations.filter(s=>s.lat!=null&&s.lng!=null).map(s=>({...s,distance:kmBetween(pos.lat,pos.lng,+s.lat,+s.lng),sameArea:!!(lookup.area&&key(s.area)===key(lookup.area))})).sort((a,b)=>Number(b.sameArea)-Number(a.sameArea)||a.distance-b.distance).slice(0,8);out.innerHTML=`${lookup.area||lookup.district?`<div class="hint">Detected area: ${esc(lookup.area||lookup.district)}${lookup.district?' · '+esc(lookup.district):''}</div>`:''}${list.map(s=>`<div class="hint" style="padding:8px 0;border-top:1px solid var(--line)"><b>${esc(s.name)} Police Station</b> · ${esc(s.area||'')} · ${esc(s.district)} · ${s.distance.toFixed(1)} km${s.phone?' · <a href="tel:'+esc(s.phone)+'">Call '+esc(s.phone)+'</a>':''}<br><a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.name+' Police Station '+s.area+' '+s.district)}">Open in Google Maps</a></div>`).join('')||'<div class="hint">No registered station with map coordinates was found.</div>'}${lookup.key_required?'<div class="hint">Automatic area naming needs a Google Maps API key configured by the app administrator.</div>':''}`;}catch(e){out.innerHTML=err(e.message);}}
const CATDESC = {"Theft": "Stolen phone, bag, money or other property.", "Motorcycle (boda) or vehicle theft": "A stolen motorcycle, car or other vehicle.", "Cattle theft": "Stolen cattle, goats or other livestock.", "Burglary or break-in": "Someone broke into a home, shop or office.", "Robbery": "Theft using force or threats against a person.", "Armed robbery (gun or panga)": "Robbery by attackers with a gun, panga, knife or other weapon.", "Assault": "Beating, stabbing or wounding someone.", "Murder or killing": "A person has been killed or a body found.", "Mob justice": "A crowd attacking or killing a suspect.", "Kidnapping or abduction": "A person taken or held against their will, including for ransom.", "Threats or harassment": "Threats, stalking or repeated harassment.", "Extortion or blackmail": "Demanding money or favours with threats.", "Arson or fire outbreak": "A fire started on purpose or a fire outbreak at a home, market or vehicle.", "Vandalism": "Deliberate damage to property.", "Domestic violence": "Abuse or violence by a partner or family member.", "Sexual violence": "Rape or sexual assault.", "Defilement or child abuse": "Sexual abuse, violence or neglect of a child under 18.", "Human trafficking": "Moving or holding people for forced work or exploitation.", "Missing person": "Someone who is missing.", "Fraud or scam": "Being cheated out of money or property.", "Mobile money fraud": "Fake MoMo or Airtel Money messages, SIM swap, wrong-number tricks.", "Cybercrime": "Hacking, online scams, harassment or threats online.", "Forgery or counterfeit": "Fake documents, fake money or counterfeit goods.", "Drug-related": "Selling, making or using illegal drugs.", "Illegal firearms": "Someone holding or selling a gun without a licence.", "Corruption": "Bribery or abuse of office, including by a police officer.", "Land dispute": "Land grabbing, illegal eviction or forged titles.", "Public disorder or riot": "Riots, unlawful gatherings or serious disturbance.", "Traffic or road crime": "Hit-and-run, reckless driving or road offences.", "Other": "A crime not listed above."};
const CATGROUPS = {'Violent crime':['Assault','Armed robbery (gun or panga)','Robbery','Murder or killing','Mob justice','Kidnapping or abduction','Threats or harassment','Extortion or blackmail','Arson or fire outbreak'],'Property crime':['Theft','Motorcycle (boda) or vehicle theft','Cattle theft','Burglary or break-in','Vandalism','Land dispute'],'Crimes against women and children':['Domestic violence','Sexual violence','Defilement or child abuse','Human trafficking','Missing person'],'Fraud and cyber crime':['Fraud or scam','Mobile money fraud','Cybercrime','Forgery or counterfeit'],'Corruption, drugs and public order':['Corruption','Drug-related','Illegal firearms','Public disorder or riot','Traffic or road crime'],'Other':['Other']};
CATDESC.Terrorism='Terrorist threats, attacks, or suspected explosive devices.'; CATGROUPS['Safety and security']=['Terrorism'];
function vStats() {
  $app.innerHTML = `<div class="wrap"><h2>Crime statistics</h2><div id="st" class="hint">Loading…</div><a class="btn" href="#home" style="margin-top:12px;justify-content:center">Back to home</a></div>`;
  api('/api/public/stats').then(d => {
    const max = Math.max(1, ...d.byCategory.map(c => c.n));
    document.getElementById('st').innerHTML = `<div class="card"><b>${d.total}</b> reports received · <b>${d.resolved}</b> resolved</div><h3>Most reported</h3>${d.byCategory.map(c => `<div>${esc(c.category)} <span class="hint">${c.n}</span></div><div class="hbar" style="width:${Math.round(c.n / max * 100)}%"></div>`).join('') || '<div class="hint">No reports yet.</div>'}<div class="hint">Counts of reports submitted through this portal only.</div>`;
  }).catch(() => document.getElementById('st').textContent = 'Could not load statistics.');
}

  sessionStorage.setItem('kiosk', '1'); sessionStorage.removeItem('consent'); sessionStorage.setItem('rstage', 'privacy'); lsSet('draft', '{}');
  location.hash = '#report';
}

    <div class="card"><b>Mobile money fraud</b><div class="hint">Never share your PIN or a one-time code. Staff will not ask for it. Be careful with "sent by mistake, please return" messages. Check the sender's name before you reverse or confirm money.</div></div>

}

    <div class="sos"><b>999</b> or <b>112</b> &nbsp;Call now if you or someone is in danger.</div>

document.addEventListener('click', e => {
  const f = e.target.closest('[data-fill]'); if (f) sessionStorage.setItem('fillref', f.dataset.fill);
  const pc = e.target.closest('[data-precat]'); if (pc) { sessionStorage.removeItem('consent'); sessionStorage.setItem('rstage', 'privacy'); lsSet('draft', JSON.stringify({ ...loadDraft(), category: pc.dataset.precat })); }
});

/* ---------------- REPORT ---------------- */
function loadDraft() { try { return JSON.parse(lsGet('draft') || '{}'); } catch { return {}; } }
function vReport() {
  if (sessionStorage.getItem('consent')) return vReportForm();
  const st = sessionStorage.getItem('rstage') || 'privacy';
  const bar = `<div class="offbar"><img src="/logo.png" alt="" style="height:56px;width:56px;background:#fff;border-radius:50%;padding:3px"><div><b>UGANDA POLICE FORCE</b><small>Secure online crime reporting</small></div></div>`;
  if (st === 'privacy') {
    $app.innerHTML = `${bar}<div class="wrap"><h2 style="text-align:center;font-size:26px">Privacy Statement</h2>
    <div class="card"><div class="stmt">This website is designed to let you give tip information to Uganda Police to help prevent and detect crime and protect life and property.<br><br>You are not required to give your name or other personal information. However, failing to supply requested information may slow or prevent the investigation of your tip.<br><br>By voluntarily giving information on this page, you consent to Uganda Police using and keeping it. Information you give may be used for investigation and may be shared as required by law or with other agencies handling the matter.<br><br>Your report is also compared with Ugandan law to help officers respond faster. Personal information is handled in line with Ugandan data protection law (Data Protection and Privacy Act, 2019).<br><br>If you enable automatic speech recognition, some browsers send speech to their own online recognition service. You can turn that option off and type the statement instead. The audio you choose to record is sent to the police with your report.</div></div>
    <button class="btn primary" id="go" style="justify-content:center;font-size:17px;padding:16px">I understand</button></div>`;
    document.getElementById('go').onclick = () => { sessionStorage.setItem('rstage', 'warn'); vReport(); };
  } else if (st === 'warn') {
    $app.innerHTML = `${bar}<div class="wrap"><div class="bigwarn">WARNING</div>
    <div class="sos" style="margin-top:0;font-size:17px;text-align:center">⚠ <b>If this is an emergency, call 999 or 112. Do not submit this form.</b><br>This website cannot be used to report emergencies or an immediate threat to life.</div>
    <div class="card"><div class="stmt">This form is used to report non-emergency crime and to give tips to Uganda Police.</div></div>
    <div class="card"><div class="stmt"><b>Be specific.</b> Give the place, date and time, names or descriptions of people, vehicle or boda number plates, phone numbers, and the names of any social media accounts or websites involved.</div></div>
    <h3>Indicate agreement</h3>
    <label class="check"><input type="checkbox" class="ag"> <span class="stmt">I understand that repeatedly sending tips with no investigative value may result in my tips not being considered.</span></label>
    <label class="check"><input type="checkbox" class="ag"> <span class="stmt">The information I give is correct to the best of my knowledge. I understand that knowingly giving false information to the police is an offence and can lead to imprisonment (Police Act, section 68).</span></label>
