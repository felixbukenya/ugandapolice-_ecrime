<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1f3a93">
<title>SafeReport UG · Demo inbox</title>
<style>
:root{color-scheme:light;--blue:#1f3a93;--pale:#f4f7ff;--line:#c8d6ee;--ink:#132447;--mute:#536687}*{box-sizing:border-box}body{font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:560px;min-height:100vh;margin:0 auto;padding:0 16px 32px;background:var(--pale);color:var(--ink)}header{margin:0 -16px 18px;padding:16px;background:var(--blue);color:#fff;font-weight:700}main{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}h1{font-size:21px;margin:0 0 6px}p,small{color:var(--mute)}input,button{font:inherit;padding:12px;border-radius:9px;width:100%;margin:6px 0}input{border:1px solid var(--line);background:#fff;color:var(--ink)}button{border:1px solid var(--blue);background:var(--blue);color:#fff;font-weight:600;cursor:pointer}.m{background:#eaf0fc;border:1px solid #d0dcf1;border-radius:12px;padding:12px;margin:10px 0;overflow-wrap:anywhere}.m small{display:block;margin-top:6px}
</style></head><body>
<header>SafeReport UG · Demo SMS inbox</header><main><h1>Messages</h1><p>Enter the phone number used in a report to view its demo text messages.</p>
<input id="p" inputmode="tel" placeholder="+2567…"><button id="b">Show messages</button><div id="o"></div>
<script>
if (!/^https?:$/.test(location.protocol)) { document.body.innerHTML = '<div style="font:16px system-ui;padding:24px;max-width:480px;margin:auto;color:#132447;background:#f4f7ff;min-height:100vh"><h2>Server not running</h2><p>This page was opened as a file, so it cannot reach the database. Start the server first, then open <b>http://localhost:3000</b> in the browser.</p><p style="color:#536687">Steps: <code>npm install</code>, then <code>node server.js</code>. See README.</p></div>'; throw new Error('Open through the server (http://localhost:3000), not as a file.'); }
let t;const o=document.getElementById('o');async function load(){try{const r=await fetch('/api/inbox?phone='+encodeURIComponent(p.value));const j=await r.json();o.innerHTML=j.error?'<p>'+j.error+'</p>':(j.messages.map(m=>'<div class="m">'+m.body.replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))+'<br><small>'+m.created_at+' UTC</small></div>').join('')||'<p>No messages yet.</p>')}catch{o.textContent='Server not reachable.'}}
document.getElementById('b').onclick=()=>{clearInterval(t);load();t=setInterval(load,4000)};
</script></main></body></html>
