<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1412">
<title>SafeReport UG</title>
<link rel="icon" href="/logo.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233ecf9f'/%3E%3Cpath d='M16 6l8 3v6c0 5-3.5 8.5-8 11-4.5-2.500-8-6-8-11V9z' fill='%2304231a'/%3E%3C/svg%3E">
<style>
:root{--bg:#0b1412;--panel:#121f1c;--panel2:#182927;--line:#243936;--text:#e8f2ef;--mute:#8fa8a2;--accent:#3ecf9f;--accent-ink:#04231a;--red:#ff6b6b;--amber:#f5b545;--blue:#6aa7ff;--radius:14px}
*{box-sizing:border-box;margin:0}
html{color-scheme:dark}
body{background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;padding-bottom:80px}
.wrap{max-width:560px;margin:0 auto;padding:16px}
.wrap.wide{max-width:1100px}
header.top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;max-width:1100px;margin:0 auto}
.brand{font-weight:700;font-size:18px}.brand b{color:var(--accent)}
.tag{font-size:12px;color:var(--mute);border:1px solid var(--line);padding:2px 8px;border-radius:99px}
h1{font-size:30px;line-height:1.15;margin:18px 0 10px}h2{font-size:22px;margin:6px 0 12px}h3{font-size:15px;color:var(--mute);font-weight:600;margin:16px 0 8px;text-transform:uppercase;letter-spacing:.04em}
p.lead{color:var(--mute);margin-bottom:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.btn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:14px 16px;border-radius:var(--radius);border:1px solid var(--line);background:var(--panel2);color:var(--text);font:inherit;cursor:pointer;text-align:left;text-decoration:none}
.btn small{display:block;color:var(--mute);font-size:13px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}.btn.primary small{color:#0a4a37}
.btn.sm{width:auto;display:inline-flex;padding:8px 12px;font-size:14px;white-space:nowrap}
.btn.danger{border-color:#5a2a2a;color:var(--red)}
.btn:disabled{opacity:.5;cursor:wait}
.sos{border:1px solid #6b2b2b;background:#2a1517;color:#ffb3b3;border-radius:var(--radius);padding:14px;font-size:14px;margin-top:16px}.sos b{color:#ff8a8a;font-size:16px}
label{display:block;font-size:14px;margin:14px 0 6px;font-weight:600}
input,select,textarea{width:100%;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0}
textarea{min-height:110px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.hint{font-size:13px;color:var(--mute);margin-top:6px}
.err{background:#2a1517;border:1px solid #6b2b2b;color:#ffb3b3;border-radius:12px;padding:10px 12px;margin:12px 0;font-size:14px}
.ok{background:#102a22;border:1px solid #1f5a44;color:#9ff0cf;border-radius:12px;padding:10px 12px;margin:12px 0;font-size:14px}
.check{display:flex;gap:10px;align-items:flex-start;margin:16px 0;font-weight:400}.check input{width:auto;margin-top:4px}
.refbox{text-align:center;font-size:36px;font-weight:800;letter-spacing:.06em;padding:18px;margin:12px 0}
.pinbox{text-align:center;font-size:26px;letter-spacing:.25em;color:var(--amber);padding:10px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:#0d1917ee;backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:10}
nav.tabs a{flex:1;max-width:140px;text-align:center;color:var(--mute);text-decoration:none;font-size:12px;padding:6px 0;border-radius:10px}
nav.tabs a .i{display:block;font-size:20px;line-height:1.2}
nav.tabs a.on{color:var(--accent)}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.b-urgent{background:#3a1519;color:#ff8f8f;border-color:#6b2b2b}.b-high{background:#33260f;color:var(--amber);border-color:#6b4f1b}.b-normal{}
.s-Received{color:var(--blue)}.s-Resolved{color:var(--accent)}.s-Rejected{color:var(--red)}
.timeline{margin:10px 0 4px}.step{display:flex;gap:12px;padding:8px 0;position:relative;color:var(--mute)}
.step .dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);margin-top:4px;flex:none;background:var(--bg)}
.step.done{color:var(--text)}.step.done .dot{background:var(--accent);border-color:var(--accent)}
.step small{display:block;color:var(--mute);font-size:12px}
.step:not(:last-child):before{content:"";position:absolute;left:6px;top:24px;bottom:-8px;width:2px;background:var(--line)}
.msgs{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.msg{max-width:85%;padding:9px 12px;border-radius:14px;font-size:14px;background:var(--panel2);align-self:flex-start}
.msg.me{background:#14463a;align-self:flex-end}.msg small{display:block;color:var(--mute);font-size:11px;margin-top:3px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px}.tile b{font-size:26px;display:block}.tile span{font-size:12px;color:var(--mute)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bar{display:flex;align-items:center;gap:8px;font-size:13px;margin:5px 0}.bar span.k{width:120px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar i{display:block;height:10px;background:var(--accent);border-radius:5px;min-width:3px}.bar em{font-style:normal;color:var(--mute)}
.case{cursor:pointer}.case:hover{border-color:var(--accent)}
.case .meta{font-size:13px;color:var(--mute);margin:4px 0}
.case-head{display:flex;justify-content:space-between;gap:8px;align-items:center}
.sub{display:flex;gap:8px;margin:8px 0 14px;overflow:auto}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px}
.modal{position:fixed;inset:0;background:#000a;z-index:20;display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:16px}
.modal>.sheet{background:var(--bg);border:1px solid var(--line);border-radius:18px;width:100%;max-width:720px;padding:16px;margin:auto 0}
.evi{display:flex;gap:8px;flex-wrap:wrap}.evi img,.evi video{width:120px;height:120px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}th{color:var(--mute);font-weight:600}
.warn{background:#33260f;border:1px solid #6b4f1b;color:var(--amber);border-radius:12px;padding:8px 12px;font-size:13px;margin:8px 0}
footer.note{text-align:center;color:var(--mute);font-size:12px;margin:24px 0}
@media(max-width:700px){.tiles{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}

.cambox{position:relative;background:#000;border-radius:var(--radius);overflow:hidden;aspect-ratio:4/3;margin:8px 0 12px;border:1px solid var(--line)}
.cambox video{width:100%;height:100%;object-fit:cover;display:block}.cambox video.mirror{transform:scaleX(-1)}
.camshade{position:absolute;left:0;right:0;bottom:0;padding:10px 12px;background:linear-gradient(transparent,#000c);font-size:14px;text-align:center}
.pill{display:inline-block;background:#33385a;border:1px solid #5a5f8a;color:#e6e8ff;padding:6px 14px;border-radius:99px;font-weight:600;font-size:14px;margin:4px 0}
.info{background:#12303f;border:1px solid #1f5a74;color:#9fdcf5;border-radius:12px;padding:10px 12px;margin:12px 0;font-size:14px}
.stp{padding:4px 0;color:var(--mute)}.stp.done{color:var(--accent)}.stp.done:after{content:" ✓"}
td .th{width:44px;height:44px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.ok-t{color:var(--accent)}.bad-t{color:var(--red)}

.gov{background:#0a0f0e;border-bottom:1px solid var(--line);color:var(--mute);font-size:12px;padding:6px 14px;text-align:center}
.svc{display:block;text-decoration:none;color:var(--text);margin:0}.svc b{display:block;margin-bottom:4px}.svc small{color:var(--mute)}
.svcs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wlist a{display:block;padding:10px 0;border-bottom:1px solid var(--line);color:var(--blue);text-decoration:none}
.bar{height:10px;border-radius:6px;background:var(--accent);margin:4px 0 10px}
.catcard{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:14px;margin-bottom:10px;color:var(--text);font:inherit;cursor:pointer}.catcard b{display:block;margin-bottom:4px}.catcard small{color:var(--mute)}
.caution{background:#33260f;border:1px solid #6b4f1b;color:var(--amber);border-radius:12px;padding:14px;font-size:14px;margin:12px 0}

.adv h3{margin:0 0 6px;font-size:16px;text-transform:none;letter-spacing:0;color:var(--text)}.adv ul,.adv ol{padding-left:20px;margin:6px 0;line-height:1.6}
.offbar{display:flex;gap:12px;align-items:center;background:linear-gradient(90deg,#0a2a22,#14463c);padding:14px 16px;border-bottom:2px solid var(--accent)}.offbar b{display:block;font-size:17px;letter-spacing:.5px}.offbar small{color:#b9d6cd}
.stmt{font-size:16px;line-height:1.65;color:var(--text)}.bigwarn{text-align:center;font-size:30px;font-weight:700;margin:14px 0}
.grp{margin:22px 0 8px;font-size:15px;letter-spacing:.8px;text-transform:uppercase;color:var(--accent)}
.catcard{padding:18px!important}.catcard b{font-size:18px!important}.catcard small{font-size:15px;line-height:1.45}

.logo{height:36px;width:36px;background:#fff;border-radius:50%;padding:2px;vertical-align:middle;margin-right:8px}.biglogo{display:block;margin:6px auto 4px;height:104px;width:104px;background:#fff;border-radius:50%;padding:5px}
.slip{background:#fff;color:#111;border-radius:12px;padding:18px;max-width:520px;margin:0 auto 14px}.slip-h{display:flex;gap:12px;align-items:center;border-bottom:2px solid #1f2a8a;padding-bottom:10px;margin-bottom:8px;color:#1f2a8a}
.slip table{width:100%;border-collapse:collapse}.slip td{padding:5px 0;border-bottom:1px solid #ddd;font-size:14px;vertical-align:top}.slip td:first-child{color:#555;width:36%}
.slip .sigimg{max-width:240px;border:1px solid #ccc;border-radius:6px}.slip .qr{text-align:center;margin:10px 0}.slip .qr svg{width:150px;height:150px}.slip small{display:block;color:#555;word-break:break-all}.slip ul{margin:4px 0;padding-left:18px;font-size:13px}.slip-note{font-size:12px;color:#444}
@media print{body{background:#fff!important}body *{visibility:hidden}#slip,#slip *{visibility:visible}#slip{position:absolute;left:0;top:0;width:100%;max-width:none}}
</style>

<body>
<header class="top"><div class="brand"><img class="logo" src="/logo.png" alt="Uganda Police crest">SafeReport <b>UG</b></div><span class="tag">Uganda Police e-Crime Reporting</span></header>
<main id="app"></main>
<nav class="tabs" id="tabs">
  <a href="#home" data-t="home"><span class="i">⌂</span>Home</a>
  <a href="#report" data-t="report"><span class="i">＋</span>Report</a>
  <a href="#track" data-t="track"><span class="i">⌕</span>Track</a>
  <a href="#police" data-t="police"><span class="i">⛨</span>Police</a>
</nav>

<script src="/vendor/qrcode.js"></script>
<script>
if (!/^https?:$/.test(location.protocol)) { document.body.innerHTML = '<div style="font:16px system-ui;padding:24px;max-width:480px;margin:auto;color:#e8f2ef;background:#0b1412;min-height:100vh"><h2>Server not running</h2><p>This page was opened as a file, so it cannot reach the database. Start the server first, then open <b>http://localhost:3000</b> in the browser.</p><p style="color:#8fa8a2">Steps: <code>npm install</code>, then <code>node server.js</code>. See README.</p></div>'; throw new Error('Open through the server (http://localhost:3000), not as a file.'); }

'use strict';
const $app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let META = { districts: [], categories: [], statuses: [] };
let ME = null;                 // logged-in police user
let draftFiles = [];           // evidence files for the report form
let policeTab = 'dashboard';
let modalRef = null;
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };

async function api(path, method = 'GET', body) {
  const r = await fetch(path, { method, headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
  const ct = r.headers.get('content-type') || '';
  const data = ct.includes('json') ? await r.json() : await r.text();
  if (!r.ok) throw new Error((data && data.error) || 'Request failed');
  return data;
}
// server timestamps (with seconds) are UTC -> show in the viewer's local time; occurred_at (16 chars) is already local
const fmt = d => { if (!d) return ''; d = String(d).replace('T', ' ');
  if (d.length > 16) { const t = new Date(d.slice(0, 19).replace(' ', 'T') + 'Z'); if (!isNaN(t)) { const p = n => String(n).padStart(2, '0'); return `${t.getFullYear()}-${p(t.getMonth() + 1)}-${p(t.getDate())} ${p(t.getHours())}:${p(t.getMinutes())}`; } }
  return esc(d.slice(0, 16)); };
const badge = p => `<span class="badge b-${esc(p)}">${esc(p)}</span>`;
const err = m => `<div class="err" role="alert">${esc(m)}</div>`;

/* ---------------- router ---------------- */
async function route() {
  let h = (location.hash || '#home').slice(1).split('?')[0];
  if (h.startsWith('track/')) { sessionStorage.setItem('fillref', decodeURIComponent(h.slice(6))); h = 'track'; }
  document.querySelectorAll('#tabs a').forEach(a => a.classList.toggle('on', a.dataset.t === h));
  window.scrollTo(0, 0);
  ({ home: vHome, report: vReport, track: vTrack, police: vPolice, kiosk: vKiosk, stats: vStats, safety: vSafety, victims: vVictims }[h] || vHome)();
}
window.addEventListener('hashchange', route);

/* ---------------- HOME ---------------- */
function vHome() {
  const mine = (lsGet('myrefs') || '').split(',').filter(Boolean);
  $app.innerHTML = `<div class="gov">🇺🇬 Uganda Police e-Crime portal · prototype</div><div class="wrap">
    <img class="biglogo" src="/logo.png" alt="Uganda Police crest">
    <div class="sos" style="margin-top:0"><b>If this is an emergency, call 999 or 112.</b> Do not submit a tip for danger happening right now.</div>
    <h1>Submit a tip.<br>Protect your community.</h1>
    <p class="lead">Report a crime to Uganda Police, anonymously if you wish. Add a voice message or your live location, and follow your case with a reference number.</p>
    <a class="btn primary" href="#report" data-precat=""><span>Submit a Tip<small>Anonymous option · voice and location supported</small></span><span>→</span></a>
    <div style="height:10px"></div>
    <a class="btn" href="#track"><span>Track a report<small>Use your reference number and PIN</small></span><span>→</span></a>
    ${mine.length ? `<h3>Reports on this device</h3>${mine.slice(-3).reverse().map(r => `<a class="btn" style="margin-bottom:8px" href="#track" data-fill="${esc(r)}"><span>${esc(r)}<small>Tap to track (you will need your PIN)</small></span><span>→</span></a>`).join('')}` : ''}
    <h3>Report crime and fraud</h3>
    <div class="card wlist" style="padding:4px 14px">
      <a href="#report" data-precat="">Submit an anonymous tip online</a>
      <a href="#report" data-precat="Mobile money fraud">Report mobile money fraud</a>
      <a href="#report" data-precat="Cybercrime">Report cyber scams and incidents</a>
      <a href="#report" data-precat="Corruption">Report corruption, including by an officer</a>
      <a href="#report" data-precat="Defilement or child abuse">Report a crime against a child</a>
    </div>
    <h3>Services</h3>
    <div class="svcs">
      <a class="card svc" href="#stats"><b>📊 Crime statistics</b><small>What is being reported</small></a>
      <a class="card svc" href="#safety"><b>🛡 Scams & safety</b><small>Stay safe, spot fraud</small></a>
      <a class="card svc" href="#victims"><b>🤝 Victim support</b><small>What to do after a crime</small></a>
      <a class="card svc" href="#track"><b>🔎 Case status</b><small>Check progress, reply to police</small></a>
    </div>
    <h3>Police sign-in</h3>
    <a class="btn" href="#police"><span>Officers<small>National ID number and password</small></span><span>→</span></a>
    <footer class="note">Reports are reviewed by Uganda Police officers. Knowingly giving false information to the police is an offence.</footer>
  </div>`;
}
const CATDESC = {"Theft": "Stolen phone, bag, money or other property.", "Motorcycle (boda) or vehicle theft": "A stolen motorcycle, car or other vehicle.", "Cattle theft": "Stolen cattle, goats or other livestock.", "Burglary or break-in": "Someone broke into a home, shop or office.", "Robbery": "Theft using force or threats against a person.", "Armed robbery (gun or panga)": "Robbery by attackers with a gun, panga, knife or other weapon.", "Assault": "Beating, stabbing or wounding someone.", "Murder or killing": "A person has been killed or a body found.", "Mob justice": "A crowd attacking or killing a suspect.", "Kidnapping or abduction": "A person taken or held against their will, including for ransom.", "Threats or harassment": "Threats, stalking or repeated harassment.", "Extortion or blackmail": "Demanding money or favours with threats.", "Arson or fire outbreak": "A fire started on purpose or a fire outbreak at a home, market or vehicle.", "Vandalism": "Deliberate damage to property.", "Domestic violence": "Abuse or violence by a partner or family member.", "Sexual violence": "Rape or sexual assault.", "Defilement or child abuse": "Sexual abuse, violence or neglect of a child under 18.", "Human trafficking": "Moving or holding people for forced work or exploitation.", "Missing person": "Someone who is missing.", "Fraud or scam": "Being cheated out of money or property.", "Mobile money fraud": "Fake MoMo or Airtel Money messages, SIM swap, wrong-number tricks.", "Cybercrime": "Hacking, online scams, harassment or threats online.", "Forgery or counterfeit": "Fake documents, fake money or counterfeit goods.", "Drug-related": "Selling, making or using illegal drugs.", "Illegal firearms": "Someone holding or selling a gun without a licence.", "Corruption": "Bribery or abuse of office, including by a police officer.", "Land dispute": "Land grabbing, illegal eviction or forged titles.", "Public disorder or riot": "Riots, unlawful gatherings or serious disturbance.", "Traffic or road crime": "Hit-and-run, reckless driving or road offences.", "Other": "A crime not listed above."};
const CATGROUPS = {'Violent crime':['Assault','Armed robbery (gun or panga)','Robbery','Murder or killing','Mob justice','Kidnapping or abduction','Threats or harassment','Extortion or blackmail','Arson or fire outbreak'],'Property crime':['Theft','Motorcycle (boda) or vehicle theft','Cattle theft','Burglary or break-in','Vandalism','Land dispute'],'Crimes against women and children':['Domestic violence','Sexual violence','Defilement or child abuse','Human trafficking','Missing person'],'Fraud and cyber crime':['Fraud or scam','Mobile money fraud','Cybercrime','Forgery or counterfeit'],'Corruption, drugs and public order':['Corruption','Drug-related','Illegal firearms','Public disorder or riot','Traffic or road crime'],'Other':['Other']};
function vStats() {
  $app.innerHTML = `<div class="wrap"><h2>Crime statistics</h2><div id="st" class="hint">Loading…</div><a class="btn" href="#home" style="margin-top:12px;justify-content:center">Back to home</a></div>`;
  api('/api/public/stats').then(d => {
    const max = Math.max(1, ...d.byCategory.map(c => c.n));
    document.getElementById('st').innerHTML = `<div class="card"><b>${d.total}</b> reports received · <b>${d.resolved}</b> resolved</div><h3>Most reported</h3>${d.byCategory.map(c => `<div>${esc(c.category)} <span class="hint">${c.n}</span></div><div class="bar" style="width:${Math.round(c.n / max * 100)}%"></div>`).join('') || '<div class="hint">No reports yet.</div>'}<div class="hint">Counts of reports submitted through this portal only.</div>`;
  }).catch(() => document.getElementById('st').textContent = 'Could not load statistics.');
}
function vKiosk() {
  sessionStorage.setItem('kiosk', '1'); sessionStorage.removeItem('consent'); sessionStorage.setItem('rstage', 'privacy'); lsSet('draft', '{}');
  location.hash = '#report';
}
function vSafety() {
  $app.innerHTML = `<div class="wrap"><h2>Scams & safety</h2>
    <div class="card"><b>Mobile money fraud</b><div class="hint">Never share your PIN or a one-time code. Staff will not ask for it. Be careful with "sent by mistake, please return" messages. Check the sender's name before you reverse or confirm money.</div></div>
    <div class="card"><b>Calls and links</b><div class="hint">Do not click links from unknown senders. Hang up on callers who rush you to pay, and call the company back on its official number.</div></div>
    <div class="card"><b>Keep evidence</b><div class="hint">Save messages, screenshots, transaction IDs and the number used, then attach them to your report.</div></div>
    <a class="btn primary" href="#report" data-precat="Mobile money fraud" style="justify-content:center">Report a scam</a></div>`;
}
function vVictims() {
  $app.innerHTML = `<div class="wrap"><h2>Victim support</h2>

function prepFile(f) {
  return new Promise((resolve, reject) => {
    if (f.type === 'video/mp4') {

    }
    if (!f.type.startsWith('image/')) return reject(new Error('Only photos and MP4 video are allowed.'));
    const img = new Image(), u = URL.createObjectURL(f);
    img.onload = () => {
      const s = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
      resolve({ name: f.name, mime: 'image/jpeg', data: c.toDataURL('image/jpeg', .8).split(',')[1] });
    };
    img.onerror = () => reject(new Error('Could not read that image.')); img.src = u;
  });
}

    <div class="meta">${esc(r.category)} · ${esc(r.district)}${r.place ? ', ' + esc(r.place) : ''} · ${fmt(r.occurred_at)}${r.station_name ? ' · 🏢 ' + esc(r.station_name) : ' · 🏢 unassigned'}${r.ob_number ? ' · 📒 ' + esc(r.ob_number) : ''}${r.assigned_name ? ' · 👮 ' + esc(r.assigned_name) : ''}${r.duplicate_of ? ' · ⚠ possible duplicate of ' + esc(r.duplicate_of) : ''}</div>
    <div>${esc(r.description.slice(0, 160))}${r.description.length > 160 ? '…' : ''}</div></div>`).join('') : '<div class="hint">No reports match.</div>';

document.addEventListener('click', e => { const c = e.target.closest('[data-open]'); if (c) openCase(c.dataset.open); });
async function openCase(ref) {

     ${(r.rag.laws || []).map(l => `<div class="hint"><b>${esc(l.source)} · ${esc(l.ref)}</b>: ${esc(l.text)}</div>`).join('')}

   <div class="card"><b>Reporter:</b> ${r.anonymous ? 'Anonymous (message via tracking thread)' : `${esc(r.reporter_name || '')} · ${esc(r.reporter_phone || '')}`}</div>

   <h3>Manage case</h3><div class="row"><div><label>Status</label><select id="cs">${META.statuses.map(x => `<option ${r.status === x ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select></div>

}
async function pUsers() {
  const body = document.getElementById('pbody'), { users } = await api('/api/admin/users');

  <div class="card"><b>Add officer</b><div class="hint">The officer signs in with their National ID number and this temporary password.</div><form id="uf"><div class="row"><div><label>Full name</label><input id="un" required></div><div><label>National ID number</label><input id="un2" maxlength="14" placeholder="CM…………" autocapitalize="characters" required></div></div>
  <div class="row"><div><label>Username</label><input id="uu" required></div><div><label>Temporary password (8+)</label><input id="up" type="password" required></div></div>
  <div class="row"><div><label>Role</label><select id="ur"><option>officer</option><option>commander</option><option>admin</option></select></div><div><label>Station</label><input id="us"></div></div>
  <div id="uerr"></div><button class="btn sm primary" style="margin-top:12px">Create user</button></form></div>`;
  body.onclick = async e => {
    const t = e.target.closest('[data-tog]'), r = e.target.closest('[data-rf]'), ul = e.target.closest('[data-ul]');
